<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Daily Bread Studies</title>
  <meta name="description" content="Daily Bible readings and studies for the Daily Bread reading plan: Torah, Prophets, Writings and Apostles, in the Berean Standard Bible.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=Inter:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/reader.css">
</head>
<body>

<main class="reader" id="reader">
  <h1 class="page-title">My Daily Bread Studies</h1>
  <div id="day-header"></div>
  <div id="portions"><p class="status">Loading today’s readings…</p></div>
  <p class="reader-footer">
    Scripture and footnotes from the Berean Standard Bible (BSB), dedicated to the public domain.
  </p>
  <div class="fn-pop" id="fn-pop" role="dialog" hidden></div>
</main>

<!-- Blessings shown before the first portion each day -->
<template id="blessings-template">
  <div class="blessings-section">
    <p class="blessings-title">Blessings</p>

    <div class="blessing">
      <span class="lead">Blessed</span> are you, Lord our God, King of the universe, who has sanctified us with his commandments and has commanded us to engage in study of the words of Torah. Please, Lord our God, make the words of your Torah sweet in our mouth, and in the mouth of your people, the house of Israel. May we and our descendants, and the descendants of your people, the house of Israel, all know your name and study your Torah for its own sake. Blessed are you, Lord, who teaches Torah to his people Israel.
      <span class="hebrew-blessing"><span class="lead-he">בָּרוּךְ</span> אַתָּה יי אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָֽׁנוּ בְּמִצְוֹתָיו, וְצִוָּֽנוּ לַעֲסֹק בְּדִבְרֵי תוֹרָה. וְהַעֲרֶב נָא יי אֱלֹהֵֽינוּ אֶת דִּבְרֵי תוֹרָתְךָ בְּפִֽינוּ, וּבְפִי עַמְּךָ בֵּית יִשְׂרָאֵל, וְנִהְיֶה אֲנַֽחְנוּ וְצֶאֱצָאֵֽינוּ, וְצֶאֱצָאֵי עַמְּךָ בֵּית יִשְׂרָאֵל, כֻּלָּֽנוּ יוֹדְעֵי שְׁמֶֽךָ, וְלוֹמְדֵי תוֹרָתֶֽךָ לִשְׁמָהּ. בָּרוּךְ אַתָּה יי, הַמְלַמֵּד תּוֹרָה לְעַמּוֹ יִשְׂרָאֵל.</span>
    </div>

    <div class="blessing">
      <span class="lead">Blessed</span> are you, Lord our God, King of the universe, who gives the Torah of truth and the good news of salvation to his people Israel and to all peoples through his Son, Yeshua the Messiah, our Master. Blessed are you, Lord, giver of the Torah.
      <span class="hebrew-blessing"><span class="lead-he">בָּרוּךְ</span> אַתָּה יי אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם, אֲשֶׁר נוֹתֵן תּוֹרַת אֶמֶת וּבְשׂוֹרַת יְשׁוּעָה לְעַמּוֹ יִשְׂרָאֵל וּלְכָל הָעַמִּים עַל־יְדֵי בְּנוֹ יֵשׁוּעַ הַמָשִׁיחַ אֲדֹנֵינוּ.</span>
    </div>

    <div class="blessing">
      <span class="scripture-quote">Open my eyes, that I may behold wondrous things from your Torah.</span>
      <span class="hebrew-blessing">גַּל־עֵינַי וְאַבִּיטָה נִפְלָאוֹת מִתּוֹרָתֶךָ׃</span>
    </div>
  </div>
  <hr class="blessings-divider">
</template>

<script src="assets/reader.js"></script>
</body>
</html>
