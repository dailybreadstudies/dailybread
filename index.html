<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Bread Studies</title>
  <meta name="description" content="Daily Bible readings and studies for the Daily Bread reading plan: Torah, Prophets, Writings and Apostles, in the Berean Standard Bible.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=Inter:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/reader.css">
  <script>
    /* Apply a saved Light/Dark choice before the page paints (avoids a flash) */
    try { var t = JSON.parse(localStorage.getItem('dbs-settings') || '{}').theme;
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>

<main class="reader" id="reader">
  <h1 class="page-title">Daily Bread Studies</h1>
  <div id="day-header"></div>
  <div id="portions"><p class="status">Loading today’s readings…</p></div>
  <p class="reader-footer">
    Scripture and footnotes from the Berean Standard Bible (BSB), dedicated to the public domain.<br>
    Jewish calendar and Shabbat times from <a href="https://www.hebcal.com" rel="noopener">Hebcal.com</a> (CC BY 4.0).
  </p>
  <div class="fn-pop" id="fn-pop" role="dialog" hidden></div>
</main>

<!-- Blessings shown before the first portion each day -->
<template id="blessings-template">
  <div class="blessings-section">
    <p class="blessings-title">Blessings</p>

    <div class="blessing">
      <span class="lead">Blessed</span> are you, Lord our God, King of the universe, who has sanctified us with his commandments and has commanded us to engage in study of the words of Torah. Please, Lord our God, make the words of your Torah sweet in our mouth, and in the mouth of your people, the house of Israel. May we and our descendants, and the descendants of your people, the house of Israel, all know your name and study your Torah for its own sake. Blessed are you, Lord, who teaches Torah to his people Israel.
      <span class="hebrew-blessing"><span class="lead-he">בָּרוּךְ</span> אַתָּה יי אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָֽׁנוּ בְּמִצְוֹתָיו, וְצִוָּֽנוּ לַעֲסֹק בְּדִבְרֵי תוֹרָה. וְהַעֲרֶב נָא יי אֱלֹהֵֽינוּ אֶת דִּבְרֵי תוֹרָתְךָ בְּפִֽינוּ, וּבְפִי עַמְּךָ בֵּית יִשְׂרָאֵל, וְנִהְיֶה אֲנַֽחְנוּ וְצֶאֱצָאֵֽינוּ, וְצֶאֱצָאֵי עַמְּךָ בֵּית יִשְׂרָאֵל, כֻּלָּֽנוּ יוֹדְעֵי שְׁמֶֽךָ, וְלוֹמְדֵי תוֹרָתֶֽךָ לִשְׁמָהּ. בָּרוּךְ אַתָּה יי, הַמְלַמֵּד תּוֹרָה לְעַמּוֹ יִשְׂרָאֵל.</span>
    </div>

    <div class="blessing">
      <span class="lead">Blessed</span> are you, Lord our God, King of the universe, who gives the Torah of truth and the good news of salvation to his people Israel and to all peoples through his Son, Yeshua the Messiah, our Master. Blessed are you, Lord, giver of the Torah.
      <span class="hebrew-blessing"><span class="lead-he">בָּרוּךְ</span> אַתָּה יי אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם, אֲשֶׁר נוֹתֵן תּוֹרַת אֶמֶת וּבְשׂוֹרַת יְשׁוּעָה לְעַמּוֹ יִשְׂרָאֵל וּלְכָל הָעַמִּים עַל־יְדֵי בְּנוֹ יֵשׁוּעַ הַמָשִׁיחַ אֲדֹנֵינוּ. בָּרוּךְ אַתָּה יי, נוֹתֵן הַתּוֹרָה.</span>
    </div>

    <div class="blessing">
      <span class="scripture-quote">Open my eyes, that I may behold wondrous things from your Torah.</span>
      <span class="hebrew-blessing">גַּל־עֵינַי וְאַבִּיטָה נִפְלָאוֹת מִתּוֹרָתֶךָ׃</span>
    </div>
  </div>
  <hr class="blessings-divider">
</template>

<!-- Tools: calendar and reading settings [ A / א ] -->
<div class="tools">
<button type="button" class="tool-btn cal-btn" id="cal-btn" aria-haspopup="dialog" aria-expanded="false"
        aria-controls="cal-panel" title="Calendar: choose a day" aria-label="Calendar">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
    <circle cx="8.5" cy="14.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14.5" r="0.9" fill="currentColor" stroke="none"/>
  </svg>
</button>
<button type="button" class="tool-btn settings-btn" id="settings-btn" aria-haspopup="dialog" aria-expanded="false"
        aria-controls="settings-panel" title="Reading settings: text, appearance, divine name and wording">
  <span class="sb-en">A</span><span class="sb-sep">/</span><span class="sb-he">א</span>
</button>
</div>
<div class="settings-panel cal-panel" id="cal-panel" role="dialog" aria-label="Calendar" hidden></div>
<div class="settings-panel" id="settings-panel" role="dialog" aria-label="Reading settings" hidden>
  <div class="sp-head">
    <span class="sp-title">Reading settings</span>
    <button type="button" class="sp-close" data-close aria-label="Close settings">&times;</button>
  </div>

  <div class="sp-row">
    <span class="sp-label">Text size</span>
    <div class="sp-stepper">
      <button type="button" data-size="-1" aria-label="Smaller text"><span class="sp-a-small">A</span></button>
      <span class="sp-value" data-size-label>113%</span>
      <button type="button" data-size="1" aria-label="Larger text"><span class="sp-a-large">A</span></button>
    </div>
  </div>

  <div class="sp-row">
    <span class="sp-label">Appearance</span>
    <div class="sp-seg" role="group" aria-label="Appearance">
      <button type="button" data-theme-opt="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-opt="dark" aria-pressed="false">Dark</button>
      <button type="button" data-theme-opt="system" aria-pressed="true">Auto</button>
    </div>
  </div>

  <div class="sp-row">
    <span class="sp-label">Typeface</span>
    <div class="sp-seg" role="group" aria-label="Typeface">
      <button type="button" data-font="serif" aria-pressed="true" class="sp-serif">Serif</button>
      <button type="button" data-font="sans" aria-pressed="false" class="sp-sans">Sans</button>
    </div>
  </div>

  <div class="sp-row">
    <span class="sp-label">Divine name</span>
    <div class="sp-seg sp-seg-name" role="group" aria-label="Divine name">
      <button type="button" data-name="lord" aria-pressed="true"><span class="dn-sample">Lord</span></button>
      <button type="button" data-name="adonai" aria-pressed="false"><span class="dn-sample">Adonai</span></button>
      <button type="button" data-name="hashem" aria-pressed="false"><span class="dn-sample">HaShem</span></button>
    </div>
  </div>

  <div class="sp-row">
    <span class="sp-label">Name style</span>
    <div class="sp-seg" role="group" aria-label="Divine name style">
      <button type="button" data-namecase="caps" aria-pressed="true">Full caps</button>
      <button type="button" data-namecase="small" aria-pressed="false"><span class="sp-smallcaps">Small caps</span></button>
    </div>
  </div>

  <div class="sp-divider"></div>

  <button type="button" class="sp-switch" role="switch" aria-checked="false" data-setting="messianic">
    <span class="sp-switch-text">
      <span class="sp-switch-title">Messianic filter</span>
      <span class="sp-switch-sub">Yeshua, Messiah, Torah, immersion, assembly…</span>
    </span>
    <span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span>
  </button>

  <button type="button" class="sp-switch" role="switch" aria-checked="false" data-setting="hebrewNames">
    <span class="sp-switch-text">
      <span class="sp-switch-title">Hebrew names</span>
      <span class="sp-switch-sub">Yerushalayim, Moshe, Yehoshafat, Yoram…</span>
    </span>
    <span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span>
  </button>
</div>

<script src="assets/reader.js"></script>
</body>
</html>
