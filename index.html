<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Bread Studies</title>
  <meta name="description" content="Bible reader and studies for the Daily Bread reading plan: Torah, Prophets, Writings and Apostles">
  <style>
    :root { --bg: #faf7f0; --text: #2b2620; --muted: #6b6257; --accent: #8a5a2b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1a16; --text: #ede6da; --muted: #a89d8e; --accent: #d9a46a; }
    }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: Georgia, "Times New Roman", serif; line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 4rem 16px; text-align: center; }
    h1 { font-size: 2.4rem; margin: 0 0 .5rem; color: var(--accent); }
    p { color: var(--muted); font-size: 1.1rem; }
    .sections { margin-top: 2rem; font-variant: small-caps; letter-spacing: .05em; }
  </style>
</head>
<body>
  <main>
    <h1>Daily Bread Studies</h1>
    <p>Bible reader and studies for the Daily Bread reading plan.</p>
    <p class="sections">Torah · Prophets · Writings · Apostles</p>
    <p>Coming soon.</p>
  </main>
</body>
</html>
